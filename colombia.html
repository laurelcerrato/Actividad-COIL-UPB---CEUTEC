<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platos Típicos - Colombia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor">

        <header class="encabezado">
            <div class="marca">
                <img class="logo" src="img/logo.png" alt="Logo Dos Tierras">
                <h1 class="titulo">PLATOS TIPICOS</h1>
            </div>
            <nav class="menu">
                <a class="boton-filtro" href="honduras.html">HONDURAS</a>
                <a class="boton-filtro activo" href="colombia.html">COLOMBIA</a>
                <a class="boton-filtro" href="index.html">TODOS</a>
            </nav>
        </header>

        <main class="grilla una-fila">
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/colombia1.png" alt="Mute">
                    <h3 class="tarjeta-nombre">MUTE</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$18,500</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/colombia3.png" alt="Bandeja paisa">
                    <h3 class="tarjeta-nombre">BANDEJA PAISA</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$28,500</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/colombia2.png" alt="Ajiaco">
                    <h3 class="tarjeta-nombre">AJIACO</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$21,900</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/colombia4.png" alt="Lechona tolimense">
                    <h3 class="tarjeta-nombre">LECHONA TOLIMENSE</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$26,500</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
        </main>

        <div class="ver-mas">
            <a class="boton-ver-mas" href="index.html">VER MAS</a>
        </div>

    </div>
</body>
</html>
