<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platos Típicos - Honduras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor">

        <header class="encabezado">
            <div class="marca">
                <img class="logo" src="img/logo.png" alt="Logo Dos Tierras">
                <h1 class="titulo">PLATOS TIPICOS</h1>
            </div>
            <nav class="menu">
                <a class="boton-filtro activo" href="honduras.html">HONDURAS</a>
                <a class="boton-filtro" href="colombia.html">COLOMBIA</a>
                <a class="boton-filtro" href="index.html">TODOS</a>
            </nav>
        </header>

        <main class="grilla una-fila">
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/honduras1.png" alt="Baleada">
                    <h3 class="tarjeta-nombre">BALEADA</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$14,500</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/honduras2.png" alt="Tamal">
                    <h3 class="tarjeta-nombre">TAMAL</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$16,800</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/honduras4.png" alt="Tortillas">
                    <h3 class="tarjeta-nombre">TORTILLAS</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$11,500</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
            <article class="tarjeta">
                <div class="tarjeta-verde">
                    <img class="tarjeta-img" src="img/honduras3.png" alt="Pollo con tajadas">
                    <h3 class="tarjeta-nombre">POLLO CON TAJADAS</h3>
                </div>
                <div class="tarjeta-pie">
                    <p class="precio">$24,900</p>
                    <a class="boton-comprar" href="#">COMPRAR</a>
                </div>
            </article>
        </main>

        <div class="ver-mas">
            <a class="boton-ver-mas" href="index.html">VER MAS</a>
        </div>

    </div>
</body>
</html>
